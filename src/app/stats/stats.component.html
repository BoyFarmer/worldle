@if (stats | async; as s) {
  <div class="stats-row">
    <div class="stat">
      <span class="stat-val">{{s[0].length}}</span>
      <span class="stat-lbl">played</span>
    </div>
    <div class="stat">
      <span class="stat-val">{{s[1][0] | number:'1.0-0'}}%</span>
      <span class="stat-lbl">won</span>
    </div>
    <div class="stat">
      <span class="stat-val">{{s[1][2] | number:'1.1-1'}}</span>
      <span class="stat-lbl">avg tries</span>
    </div>
  </div>
}
