<div class="row" [class.row--filled]="!!guess()">
  <span class="row-num">{{number()}}</span>

  @if (guess(); as g) {
    <span class="row-name">{{displayName()}}</span>
    <span [class]="'dist-badge dist-badge--' + distanceLevel()">
      {{g.distance | distance | number:'1.0-0'}} km
    </span>
    <mat-icon class="dir-icon" [style.transform]="g.direction | direction">east</mat-icon>
  } @else {
    <span class="row-empty"></span>
  }
</div>
